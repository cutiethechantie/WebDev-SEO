<html>
<head>
    <meta charset="UTF-8">
    <title>Форма обратной связи - Туроператор-онлайн</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-body">
    <header class="header-footer-block">
        <a href="index.html"><img src="logo.jpg" alt="Логотип нашего сайта" width="150"></a>
        <nav>
            <ul class="nav-list">
                <li class="nav-item"><a href="about.html" class="nav-link">О нас</a></li>
                <li class="nav-item"><a href="form.html" class="nav-link">Форма обратной связи</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1 class="center-text">Анкета для подбора тура</h1>
        <form id="tour-form" action="#" method="get" class="form-wrapper">
            <div class="form-row">
                <label class="form-label">ФИО заказчика:</label>
                <input type="text" id="fio" name="fio" class="form-input-standard">
            </div>
            <div class="form-row">
                <label class="form-label">Количество туристов:</label>
                <input type="text" id="tourists" name="tourists" class="form-input-standard">
            </div>
            <div class="form-row">
                <label class="form-label">Телефон:</label>
                <input type="text" id="phone" name="phone" class="form-input-standard" placeholder="+7(XXX)XXX-XX-XX">
            </div>
            <div class="form-row">
                <label class="form-label">Адрес электронной почты:</label>
                <input type="text" id="email" name="email" class="form-input-standard">
            </div>
            <div class="form-row">
                <label class="form-label">Желаемая звездность отеля:</label>
                <div class="form-choices-wrapper">
                    <label><input type="checkbox" name="stars" value="5"> 5 звезд</label>
                    <label><input type="checkbox" name="stars" value="4"> 4 звезды</label>
                    <label><input type="checkbox" name="stars" value="3"> 3 звезды</label>
                </div>
            </div>
            <div class="form-row">
                <label class="form-label">Выберите страну:</label>
                <div class="form-choices-wrapper">
                    <label><input type="radio" name="country" value="turkey"> Турция</label>
                    <label><input type="radio" name="country" value="egypt"> Египет</label>
                    <label><input type="radio" name="country" value="uae"> ОАЭ</label>
                    <label><input type="radio" name="country" value="maldives"> Мальдивы</label>
                    <label><input type="radio" name="country" value="thailand"> Таиланд</label>
                    <label><input type="radio" name="country" value="cuba"> Куба</label>
                </div>
            </div>
            <div class="form-row">
                <label class="form-label">Отдаленность от моря:</label>
                <select name="distance" class="form-input-standard">
                    <option value="line1">1-ая линия</option>
                    <option value="line2">2-ая линия</option>
                    <option value="line3">3-я линия</option>
                </select>
            </div>
            <div class="form-row">
                <label class="form-label">Пожелания к туру:</label>
                <textarea id="comments" rows="5" cols="40" wrap="soft" name="comments" class="form-input-standard"></textarea>
            </div>
            <div class="form-buttons">
                <input type="submit" value="Подобрать тур">
                <input type="reset" value="Очистить форму">
            </div>
        </form>

        <div id="results-area" class="results-container"></div>
    </main>
    <footer class="header-footer-block">
        <a href="https://miet.ru"><img src="miet-logo.jpg" alt="Официальный логотип НИУ МИЭТ" width="150"></a>
        <ul class="nav-list">
            <li class="nav-item"><a href="about.html" class="nav-link">О нас</a></li>
            <li class="nav-item"><a href="form.html" class="nav-link">Форма обратной связи</a></li>
        </ul>
    </footer>
    
    <script src="script.js"></script>
</body>
</html>
